name: HyperGlass Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract source
        run: |
          unzip -q HyperGlassLauncher-Source.zip -d source
          find source -name settings.gradle.kts

      - name: Build APK
        run: |
          cd source/HyperGlassLauncher
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperGlass-debug-apk
          path: source/HyperGlassLauncher/app/build/outputs/apk/debug/app-debug.apk
          
