YAML
name: Build HyperGlass APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract source
        run: |
          unzip -q HyperGlassLauncher-Source.zip -d source
          ls source/HyperGlassLauncher

      - name: Build APK
        working-directory: source/HyperGlassLauncher
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperGlass-debug-apk
          path: source/HyperGlassLauncher/app/build/outputs/apk/debug/app-debug.apk
          
